[project]
name = "b-rag-engine2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.135.0",
    "filetype>=1.2.0",
    "langchain>=1.4.2",
    "langchain-mongodb>=0.12.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "langsmith>=0.13.0",
    "mammoth>=1.11.0",
    "markitdown[pdf,docx,pptx,xlsx,youtube-transcription]>=0.1.5",
    "markitdown-ocr>=0.1.1",
    "motor>=3.7.1",
    "openai>=3.16.2",
    "pillow>=12.3.0",
    "pydantic-settings>=2.13.1",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.12",
    "reportlab>=5.0.1",
    "uvicorn>=0.32.0",
    "markdown>=3.11.2",
    "beautifulsoup4>=4.15.0",
    "slowapi>=0.1.10",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "B008",  # FastAPI Depends() in defaults is standard pattern
    "BLE001",  # Blind exception catching acceptable for fallback cases
]
