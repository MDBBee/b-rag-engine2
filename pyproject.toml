[project]
name = "b-rag-engine2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "filetype>=1.2.0",
    "langchain>=1.4.2",
    "langchain-mongodb>=0.12.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "langsmith>=0.13.0",
    "mammoth>=1.11.0",
    "markitdown[pdf,docx,pptx,xlsx]>=0.1.5",
    "motor>=3.7.1",
    "openai>=3.16.2",
    "pillow>=12.3.0",
    "pydantic-settings>=2.13.1",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.12",
    "reportlab>=5.0.1",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "B008",  # FastAPI Depends() in defaults is standard pattern
    "BLE001",  # Blind exception catching acceptable for fallback cases
]
