name: Main CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Lint backend
        run: uv run ruff check app/

  terraform-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "~> 1.15"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_api_domain: "placeholder.example.com"
          TF_VAR_your_ip: "0.0.0.0/0"
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Cleanup stale locks on failure
        if: failure() && steps.plan.outcome == 'failure'
        run: |
          if [ -f .terraform/terraform.tfstate.lock.info ]; then
            LOCK_ID=$(jq -r '.ID' .terraform/terraform.tfstate.lock.info)
            echo "Found stale lock: $LOCK_ID"
            terraform force-unlock -force "$LOCK_ID" || echo "Failed to unlock, may already be released"
          else
            echo "No lock file found, nothing to clean up"
          fi
        continue-on-error: true

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const output = `#### Terraform Plan Results
            **Status:** ${{ steps.plan.outcome == 'success' && '✅ Success' || '❌ Failed' }}

            <details><summary>Show Plan Output</summary>

            \`\`\`
            ${{ steps.plan.outputs.stdout || steps.plan.outputs.stderr }}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: ${{ github.event_name }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  acceptance-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # === BUILD PHASE ===
      - name: Build backend Docker image
        run: docker build --target prod -t b-rag-engine2:latest .

      # === CONFIGURATION PHASE ===
      - name: Configure backend environment
        run: |
          mkdir -p b-rag-engine2
          cat > b-rag-engine2/.env << EOF
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          CORS_ORIGINS=http://localhost:3000
          AUTH_ENABLED=false
          RATE_LIMIT_ENABLED=false
          EOF

      - name: Configure frontend environment
        run: |
          mkdir -p b-rag-view
          cat > b-rag-view/.env << EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          AUTH_TRUST_HOST=true
          NEXTAUTH_URL=http://localhost:3000
          API_URL=http://backend:8000
          NEXT_PUBLIC_TESTING=true
          TESTING_CODE=${{ secrets.TESTING_CODE }}
          EOF

      # === SETUP PHASE ===
      - name: Start application services
        run: docker compose -p b-rag up -d

      - name: Wait for services to be ready
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done'
          sleep 10

      # === TEST PREPARATION PHASE ===
      - name: Clone acceptance test repository
        run: git clone https://github.com/MDBBee/acceptance-test-b-rag.git acceptance-tests

      - name: Install Python test runner
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python 3.14
        run: uv python install 3.14
        working-directory: ./acceptance-tests

      - name: Install test dependencies
        run: uv sync
        working-directory: ./acceptance-tests

      # === TEST EXECUTION PHASE ===
      - name: Run Robot Framework acceptance tests
        run: uv run robot --outputdir results tests/
        working-directory: ./acceptance-tests
        env:
          BASE_URL: http://localhost:3000
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_CODE: ${{ secrets.TESTING_CODE }}
          TEST_PDF_PATH: ${{ github.workspace }}/acceptance-tests/data/attension-paper.pdf
          TESTER_NAME: ${{ secrets.TESTER_NAME }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: robot-results
          path: acceptance-tests/results/

      # === CLEANUP PHASE ===
      - name: Tear down application services
        if: always()
        run: docker compose -p b-rag down
